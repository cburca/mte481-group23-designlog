<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>G23 Tracker · MTE 481</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230f2138'/><circle cx='16' cy='16' r='9' fill='none' stroke='%23e2622a' stroke-width='2.5'/><circle cx='16' cy='16' r='2.5' fill='%23e2622a'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css?v=4">
</head>
<body class="gate-locked">

  <!-- Passcode screen (light deterrent — see README) -->
  <div id="access-gate" class="gate" hidden>
    <div class="gate__panel">
      <p class="gate__kicker">MTE 481 · Group 23</p>
      <h1 class="gate__title">Project tracker</h1>
      <p class="gate__body">Enter the passcode your team shared with you.</p>
      <form id="gate-form" class="gate__form" autocomplete="off">
        <label for="gate-input" class="sr-only">Passcode</label>
        <input id="gate-input" name="passcode" type="password" placeholder="Passcode" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button type="submit">Enter</button>
      </form>
      <p id="gate-error" class="gate__error" hidden>That passcode isn't right. Try again.</p>
    </div>
  </div>

  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#board">
        <span class="brand__mark" aria-hidden="true">G23</span>
        <span class="brand__text"><strong>Group 23</strong><span>MTE 481 capstone</span></span>
      </a>
      <nav class="nav" aria-label="Views">
        <a href="#board" data-view="board">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3" width="4.5" height="14" rx="1"/><rect x="7.75" y="3" width="4.5" height="9" rx="1"/><rect x="13.5" y="3" width="4.5" height="11" rx="1"/></svg>
          Board</a>
        <a href="#timeline" data-view="timeline">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="4" width="9" height="3" rx="1"/><rect x="6" y="8.5" width="10" height="3" rx="1"/><rect x="9" y="13" width="9" height="3" rx="1"/></svg>
          Timeline</a>
        <a href="#list" data-view="list">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="4" width="16" height="2" rx="1"/><rect x="2" y="9" width="16" height="2" rx="1"/><rect x="2" y="14" width="16" height="2" rx="1"/></svg>
          List</a>
        <a href="#worklog" data-view="worklog">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5" fill="none" stroke-width="2"/><path d="M10 5.5V10l3 2" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
          Work log</a>
        <a href="#settings" data-view="settings">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3" fill="none" stroke-width="2"/><path d="M10 2v3M10 15v3M2 10h3M15 10h3M4.3 4.3l2.1 2.1M13.6 13.6l2.1 2.1M4.3 15.7l2.1-2.1M13.6 6.4l2.1-2.1" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
          Settings</a>
      </nav>
      <div class="sidebar__foot">
        <div id="sync-status" class="sync"></div>
        <div id="whoami" class="whoami"></div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar__row">
          <h1 id="view-title">Board</h1>
          <div class="topbar__actions">
            <button class="btn btn--ghost" data-action="refresh" title="Reload from GitHub">Refresh</button>
            <button class="btn btn--primary" data-action="create">Create ticket</button>
          </div>
        </div>
        <div id="filters" class="filters"></div>
      </header>
      <div id="banner"></div>
      <section id="view" class="view" aria-live="polite"></section>
    </div>
  </div>

  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
  <aside id="drawer" class="drawer" aria-label="Ticket details" hidden></aside>

  <dialog id="create-dialog" class="dialog"></dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="assets/js/config.js?v=4"></script>
  <script src="assets/js/gate.js?v=4"></script>
  <script src="assets/js/store.js?v=4"></script>
  <script src="assets/js/app.js?v=4"></script>
</body>
</html>
