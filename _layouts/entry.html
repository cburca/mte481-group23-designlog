<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>{{ page.title }} — {{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body class="gate-locked">

  {% include gate.html %}

  {% include nav.html %}

  <main class="wrap page page--entry">
    <a class="back-link" href="{{ '/log/' | relative_url }}">&larr; Back to the log</a>

    <article class="entry">
      <header class="entry__header">
        <p class="entry__meta">
          <time class="mono" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%b %-d, %Y" }}</time>
          <span aria-hidden="true">·</span>
          <span>{{ page.author }}</span>
        </p>
        <h1>{{ page.title }}</h1>
        {% if page.tags %}
        <ul class="tag-list">
          {% for tag in page.tags %}<li class="tag">{{ tag }}</li>{% endfor %}
        </ul>
        {% endif %}
      </header>

      <div class="entry__body">
        {{ content }}
      </div>
    </article>
  </main>

  {% include footer.html %}

  <script src="{{ '/assets/js/gate.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  <script src="{{ '/assets/js/nav.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
